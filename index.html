<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>ตารางเรียน ม.6/1</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <script>
            (function () {
                var mq = window.matchMedia("(prefers-color-scheme: dark)");
                var root = document.documentElement;
                var apply = function () {
                    if (mq.matches) root.classList.add("dark");
                    else root.classList.remove("dark");
                };
                apply();
                if (mq.addEventListener) mq.addEventListener("change", apply);
                else if (mq.addListener) mq.addListener(apply);
            })();
        </script>
    </head>
    <body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-gray-900 dark:text-gray-100 min-h-screen">
        <div class="max-w-6xl mx-auto p-4 md:p-8">
            <!-- Header -->
            <header class="mb-8 animate-slide-in">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-2">
                            ตารางเรียน ม.6/1
                        </h1>
                        <p class="text-gray-600 dark:text-gray-400 text-sm flex items-center gap-2">
                            <span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                            ภาคเรียนที่ 1 โรงเรียนภูเขียว
                        </p>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="stat-card glass-effect rounded-2xl p-4 text-center">
                        <div class="text-3xl font-bold text-blue-600 dark:text-blue-400" id="totalClasses">0</div>
                        <div class="text-xs text-gray-600 dark:text-gray-300 mt-1">คาบเรียนวันนี้</div>
                    </div>
                    <div class="stat-card glass-effect rounded-2xl p-4 text-center">
                        <div class="text-3xl font-bold text-green-600 dark:text-green-400" id="completedClasses">0</div>
                        <div class="text-xs text-gray-600 dark:text-gray-300 mt-1">เรียนไปแล้ว</div>
                    </div>
                    <div class="stat-card glass-effect rounded-2xl p-4 text-center">
                        <div class="text-3xl font-bold text-purple-600 dark:text-purple-400" id="remainingClasses">0</div>
                        <div class="text-xs text-gray-600 dark:text-gray-300 mt-1">คงเหลือ</div>
                    </div>
                    <div class="stat-card glass-effect rounded-2xl p-4 text-center">
                        <div class="text-3xl font-bold text-orange-600 dark:text-orange-400" id="progressPercent">0%</div>
                        <div class="text-xs text-gray-600 dark:text-gray-300 mt-1">ความคืบหน้า</div>
                    </div>
                </div>
            </header>

            <!-- Current Time Card -->
            <div class="mb-6 animate-slide-in glass-effect rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between flex-wrap gap-4">
                    <div class="flex items-center gap-4">
                        <div class="md:order-none w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <div class="text-sm text-gray-500 dark:text-gray-400 mb-1">วันนี้</div>
                            <div id="nowDate" class="text-xl font-semibold text-gray-900 dark:text-white">—</div>
                        </div>
                    </div>
                    <div class="md:text-right">
                        <div class="text-sm text-gray-500 dark:text-gray-400 mb-1">เวลา</div>
                        <div id="nowTime" class="text-3xl font-bold mono bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">--:--:-- --</div>
                    </div>
                </div>
            </div>

            <!-- Current Period -->
            <div class="mb-6 animate-slide-in" id="currentBlock">
                <div id="currentCard" class="p-8 bg-gradient-to-br from-blue-500 via-blue-600 to-purple-600 rounded-3xl shadow-2xl text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-32 -mt-32"></div>
                    <div class="absolute bottom-0 left-0 w-48 h-48 bg-white opacity-5 rounded-full -ml-24 -mb-24"></div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="px-3 py-1 bg-white/20 rounded-full text-sm backdrop-blur-sm">กำลังเรียน</span>
                        </div>
                        <div id="currentSubject" class="text-4xl font-bold mb-3">—</div>
                        <div id="currentTeacher" class="text-xl opacity-90 mb-4">—</div>
                        <div class="mb-4 bg-white/20 rounded-full h-2 overflow-hidden backdrop-blur-sm">
                            <div id="currentProgress" class="progress-bar bg-white h-full rounded-full" style="width: 0%"></div>
                        </div>
                        <div class="flex items-center justify-between flex-wrap gap-4">
                            <div id="currentTime" class="mono text-lg opacity-90">—</div>
                            <div id="currentStatus" class="text-sm bg-white/20 px-5 py-2 rounded-full backdrop-blur-sm font-medium">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Adjacent Periods -->
            <div class="grid md:grid-cols-2 gap-4 mb-8 animate-slide-in" id="adjacentBlock">
                <!-- Previous -->
                <div class="glass-effect rounded-2xl p-6 shadow-lg hover:shadow-xl transition-all">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-5 h-5 text-gray-500 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-300 font-semibold">คาบที่แล้ว</span>
                    </div>
                    <div id="prevSubject" class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-1">—</div>
                    <div id="prevTeacher" class="text-sm text-gray-600 dark:text-gray-300 mb-2">—</div>
                    <div id="prevTime" class="mono text-sm text-gray-500 dark:text-gray-400 mb-2">—</div>
                    <div id="prevEnded" class="text-xs text-gray-400 dark:text-gray-500 flex items-center gap-1">—</div>
                </div>

                <!-- Next -->
                <div class="glass-effect rounded-2xl p-6 shadow-lg hover:shadow-xl transition-all">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-5 h-5 text-gray-500 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        <span class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-300 font-semibold">คาบถัดไป</span>
                    </div>
                    <div id="nextSubject" class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-1">—</div>
                    <div id="nextTeacher" class="text-sm text-gray-600 dark:text-gray-300 mb-2">—</div>
                    <div id="nextTime" class="mono text-sm text-gray-500 dark:text-gray-400 mb-2">—</div>
                    <div id="nextCountdown" class="text-xs text-gray-400 dark:text-gray-500 flex items-center gap-1">—</div>
                </div>
            </div>

            <!-- Tabs and List -->
            <section class="animate-slide-in">
                <div class="mb-6 glass-effect rounded-2xl p-4">
                    <div class="flex items-center justify-between gap-4">
                        <button id="prevDayBtn" class="p-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <div id="weekdayTabs" class="flex flex-wrap gap-2 justify-center"></div>
                        <button id="nextDayBtn" class="p-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <h2 id="todayTitle" class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-4 flex items-center gap-2">
                    <span class="w-1 h-8 bg-gradient-to-b from-blue-500 to-purple-600 rounded-full"></span>
                    ตารางวันนี้
                </h2>

                <!-- Search -->
                <div class="mb-4 flex items-center gap-3">
                    <div class="relative flex-1">
                        <svg class="absolute left-4 top-3.5 w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input id="searchInput" type="text" inputmode="search" placeholder="ค้นหาวิชา หรือชื่อครู" class="w-full rounded-xl border-2 border-gray-200 dark:border-slate-600 glass-effect pl-11 pr-4 py-3 outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-4 focus:ring-blue-500/20 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500" />
                        <kbd class="hidden md:block absolute right-3 top-3 text-xs px-2 py-1 rounded-lg glass-effect text-gray-500 dark:text-gray-400 font-semibold">/</kbd>
                    </div>
                    <button id="clearSearchBtn" class="px-4 py-3 rounded-xl glass-effect hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
                        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <div id="searchResults" class="space-y-2 mb-6 hidden"></div>
                <div id="todayTable" class="space-y-3"></div>
            </section>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
